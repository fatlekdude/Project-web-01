<!DOCTYPE html> //test
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ประวัติส่วนตัวของนายวรพล คุ้มกุมาร">
    <title>ประวัติส่วนตัว | วรพล คุ้มกุมาร</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="profile-card">
        <div class="profile-photo">
            <img src="images/profile.jpg" alt="รูปถ่ายของนายวรพล คุ้มกุมาร">
        </div>

        <section class="profile-info" aria-labelledby="profile-name">
            <p class="eyebrow">ประวัติส่วนตัว</p>
            <h1 id="profile-name">นายวรพล คุ้มกุมาร</h1>

            <dl class="details">
                <div class="detail">
                    <dt>อายุ</dt>
                    <dd>18 ปี</dd>
                </div>
                <div class="detail">
                    <dt>กำลังศึกษาอยู่ที่</dt>
                    <dd>วิทยาลัยอาชีวศึกษานครศรีธรรมราช</dd>
                </div>
                <div class="detail">
                    <dt>แผนก</dt>
                    <dd>เทคโนโลยีสารสนเทศ</dd>
                </div>
            </dl>
        </section>
    </main>
</body>
</html>
